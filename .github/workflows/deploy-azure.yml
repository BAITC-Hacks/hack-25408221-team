name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: invision-rg
  ACR_NAME: invisionacr            # must be globally unique, lowercase alphanumeric
  BACKEND_APP_NAME: invision-backend
  FRONTEND_APP_NAME: invision-frontend
  CONTAINER_APP_ENV: invision-env

jobs:
  # ── 1. Build & push backend ────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & push
        working-directory: backend
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/invision-backend:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/invision-backend:latest \
            .
          docker push ${{ env.ACR_NAME }}.azurecr.io/invision-backend:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/invision-backend:latest

  # ── 2. Build & push frontend ───────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & push
        working-directory: frontend
        # NEXT_PUBLIC_* are baked in at build time — pass real Azure backend URLs here
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://${{ env.BACKEND_APP_NAME }}.${{ secrets.ACA_DOMAIN_SUFFIX }} \
            --build-arg NEXT_PUBLIC_WS_URL=wss://${{ env.BACKEND_APP_NAME }}.${{ secrets.ACA_DOMAIN_SUFFIX }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/invision-frontend:${{ github.sha }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/invision-frontend:latest \
            .
          docker push ${{ env.ACR_NAME }}.azurecr.io/invision-frontend:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/invision-frontend:latest

  # ── 3. Deploy backend ─────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update backend Container App
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/invision-backend:${{ github.sha }} \
            --set-env-vars \
              GEMINI_API_KEY=secretref:gemini-api-key \
              DB_HOST=secretref:db-host \
              DB_PORT="${{ secrets.DB_PORT }}" \
              DB_USER="${{ secrets.DB_USER }}" \
              DB_NAME="${{ secrets.DB_NAME }}" \
              DB_USE_IAM_AUTH=true \
              DB_REGION="${{ secrets.DB_REGION }}" \
              AWS_REGION="${{ secrets.AWS_REGION }}" \
              AWS_S3_BUCKET=secretref:aws-s3-bucket \
              AWS_ACCESS_KEY_ID=secretref:aws-access-key-id \
              AWS_SECRET_ACCESS_KEY=secretref:aws-secret-access-key \
              JWT_SECRET=secretref:jwt-secret \
              CORS_ORIGINS="https://${{ env.FRONTEND_APP_NAME }}.${{ secrets.ACA_DOMAIN_SUFFIX }}" \
              SAPLING_API_KEY="${{ secrets.SAPLING_API_KEY }}"

  # ── 4. Deploy frontend ────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [build-frontend, deploy-backend]
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update frontend Container App
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/invision-frontend:${{ github.sha }}
