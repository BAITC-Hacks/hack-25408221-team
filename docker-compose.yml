# Local development / integration testing
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in real values
#   docker compose up --build
#
# Backend:   http://localhost:8000
# Frontend:  http://localhost:3000
# WebSocket: ws://localhost:8000/ws/{session_id}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked in at build time — pass them as build args, not env vars
        # On Linux replace localhost with the backend service name: http://backend:8000
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
